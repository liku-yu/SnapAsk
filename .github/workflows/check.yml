name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: npm run check
      - name: Build extension zip
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: snapask-extension
          path: dist/*.zip
